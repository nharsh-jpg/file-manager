image: python:3.13-slim

pipelines:
  branches:
    main:
      - step:
          name: Django Test
          caches:
            - pip
          script:
            - pip install -r requirements.txt
            - python manage.py check
            - python manage.py test

      - step:
          name: Build Docker Image
          services:
            - docker
          script:
            - docker build -t django-file-manager:$BITBUCKET_COMMIT .

definitions:
  services:
    docker:
      memory: 3072